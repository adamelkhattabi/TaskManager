<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Gestionnaire de tâches</h1>
            <div class="user-info">
                <span id="username"></span>
                <button id="logoutBtn" class="btn-logout">Déconnexion</button>
            </div>
        </header>

        <main>
            <!-- Formulaire d'ajout -->
            <div class="add-task">
                <input type="text" id="taskTitle" placeholder="Nouvelle tâche..." class="task-input">
                <input type="text" id="taskDesc" placeholder="Description (optionnelle)" class="task-input">
                <button id="addTaskBtn" class="btn-add">Ajouter</button>
            </div>

            <!-- Filtres -->
            <div class="filters">
                <button data-filter="all" class="filter-btn active">Toutes</button>
                <button data-filter="pending" class="filter-btn">À faire</button>
                <button data-filter="completed" class="filter-btn">Terminées</button>
            </div>

            <!-- Liste des tâches -->
            <div id="taskList" class="task-list"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
